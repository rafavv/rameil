<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#003e63"/>
  <!-- Intersection fill -->
  <clipPath id="fc"><circle cx="12" cy="16" r="10.5"/></clipPath>
  <circle cx="20" cy="16" r="10.5" fill="#01a1e3" opacity="0.18" clip-path="url(#fc)"/>
  <!-- Left circle: masked out where right circle overlaps -->
  <mask id="lm">
    <rect width="32" height="32" fill="white"/>
    <circle cx="20" cy="16" r="10.5" fill="black"/>
  </mask>
  <circle cx="12" cy="16" r="10.5" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="1.2" mask="url(#lm)"/>
  <!-- Right circle: full -->
  <circle cx="20" cy="16" r="10.5" fill="none" stroke="#01a1e3" stroke-width="1.4"/>
</svg>
