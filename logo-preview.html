<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logo-Varianten B</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: Urbanist, system-ui, sans-serif; background: #f4f6f8; margin: 0; padding: 40px; }
    h1 { font-size: 13px; text-transform: uppercase; letter-spacing: 3px; color: #999; margin-bottom: 40px; }
    .variants { display: flex; flex-direction: column; gap: 48px; }
    .variant { background: #fff; border-radius: 12px; padding: 40px 48px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
    .label { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: #bbb; margin-bottom: 28px; }
    .on-dark { background: #003e63; border-radius: 8px; padding: 28px 40px; margin-top: 28px; display: inline-block; }
  </style>
</head>
<body>
  <h1>Logo-Varianten · Schriftdicke</h1>
  <div class="variants">

    <!-- Variante 1: Leicht — 300 / 300 -->
    <div class="variant">
      <div class="label">Variante 1 — Light (300 / 300)</div>
      <svg viewBox="0 0 560 92" height="92" role="img" xmlns="http://www.w3.org/2000/svg">
        <circle cx="28" cy="46" r="30" fill="none" stroke="#003e63" stroke-width="2.5"/>
        <circle cx="52" cy="46" r="30" fill="none" stroke="#01a1e3" stroke-width="2.5"/>
        <clipPath id="c1a"><circle cx="28" cy="46" r="30"/></clipPath>
        <circle cx="52" cy="46" r="30" fill="#01a1e3" opacity="0.15" clip-path="url(#c1a)"/>
        <text x="98" y="52" font-family="Urbanist,system-ui,sans-serif" font-weight="300" font-size="48" fill="#003e63">Dr. Diana Rameil</text>
        <text x="100" y="82" font-family="Urbanist,system-ui,sans-serif" font-weight="300" font-size="28" fill="#01a1e3" letter-spacing="2">LL.M., M.A.</text>
      </svg>
      <div class="on-dark">
        <svg viewBox="0 0 560 92" height="92" role="img" xmlns="http://www.w3.org/2000/svg">
          <circle cx="28" cy="46" r="30" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2.5"/>
          <circle cx="52" cy="46" r="30" fill="none" stroke="#01a1e3" stroke-width="2.5"/>
          <clipPath id="c1b"><circle cx="28" cy="46" r="30"/></clipPath>
          <circle cx="52" cy="46" r="30" fill="#01a1e3" opacity="0.25" clip-path="url(#c1b)"/>
          <text x="98" y="52" font-family="Urbanist,system-ui,sans-serif" font-weight="300" font-size="48" fill="#fff">Dr. Diana Rameil</text>
          <text x="100" y="82" font-family="Urbanist,system-ui,sans-serif" font-weight="300" font-size="28" fill="#01a1e3" letter-spacing="2">LL.M., M.A.</text>
        </svg>
      </div>
    </div>

    <!-- Variante 2: Medium — 500 / 400 -->
    <div class="variant">
      <div class="label">Variante 2 — Medium (500 / 400)</div>
      <svg viewBox="0 0 560 92" height="92" role="img" xmlns="http://www.w3.org/2000/svg">
        <circle cx="28" cy="46" r="30" fill="none" stroke="#003e63" stroke-width="2.5"/>
        <circle cx="52" cy="46" r="30" fill="none" stroke="#01a1e3" stroke-width="2.5"/>
        <clipPath id="c2a"><circle cx="28" cy="46" r="30"/></clipPath>
        <circle cx="52" cy="46" r="30" fill="#01a1e3" opacity="0.15" clip-path="url(#c2a)"/>
        <text x="98" y="52" font-family="Urbanist,system-ui,sans-serif" font-weight="500" font-size="48" fill="#003e63">Dr. Diana Rameil</text>
        <text x="100" y="82" font-family="Urbanist,system-ui,sans-serif" font-weight="400" font-size="28" fill="#01a1e3" letter-spacing="2">LL.M., M.A.</text>
      </svg>
      <div class="on-dark">
        <svg viewBox="0 0 560 92" height="92" role="img" xmlns="http://www.w3.org/2000/svg">
          <circle cx="28" cy="46" r="30" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2.5"/>
          <circle cx="52" cy="46" r="30" fill="none" stroke="#01a1e3" stroke-width="2.5"/>
          <clipPath id="c2b"><circle cx="28" cy="46" r="30"/></clipPath>
          <circle cx="52" cy="46" r="30" fill="#01a1e3" opacity="0.25" clip-path="url(#c2b)"/>
          <text x="98" y="52" font-family="Urbanist,system-ui,sans-serif" font-weight="500" font-size="48" fill="#fff">Dr. Diana Rameil</text>
          <text x="100" y="82" font-family="Urbanist,system-ui,sans-serif" font-weight="400" font-size="28" fill="#01a1e3" letter-spacing="2">LL.M., M.A.</text>
        </svg>
      </div>
    </div>

    <!-- Variante 3: Bold — 700 / 500 -->
    <div class="variant">
      <div class="label">Variante 3 — Bold (700 / 500)</div>
      <svg viewBox="0 0 560 92" height="92" role="img" xmlns="http://www.w3.org/2000/svg">
        <circle cx="28" cy="46" r="30" fill="none" stroke="#003e63" stroke-width="2.5"/>
        <circle cx="52" cy="46" r="30" fill="none" stroke="#01a1e3" stroke-width="2.5"/>
        <clipPath id="c3a"><circle cx="28" cy="46" r="30"/></clipPath>
        <circle cx="52" cy="46" r="30" fill="#01a1e3" opacity="0.15" clip-path="url(#c3a)"/>
        <text x="98" y="52" font-family="Urbanist,system-ui,sans-serif" font-weight="700" font-size="48" fill="#003e63">Dr. Diana Rameil</text>
        <text x="100" y="82" font-family="Urbanist,system-ui,sans-serif" font-weight="500" font-size="28" fill="#01a1e3" letter-spacing="2">LL.M., M.A.</text>
      </svg>
      <div class="on-dark">
        <svg viewBox="0 0 560 92" height="92" role="img" xmlns="http://www.w3.org/2000/svg">
          <circle cx="28" cy="46" r="30" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2.5"/>
          <circle cx="52" cy="46" r="30" fill="none" stroke="#01a1e3" stroke-width="2.5"/>
          <clipPath id="c3b"><circle cx="28" cy="46" r="30"/></clipPath>
          <circle cx="52" cy="46" r="30" fill="#01a1e3" opacity="0.25" clip-path="url(#c3b)"/>
          <text x="98" y="52" font-family="Urbanist,system-ui,sans-serif" font-weight="700" font-size="48" fill="#fff">Dr. Diana Rameil</text>
          <text x="100" y="82" font-family="Urbanist,system-ui,sans-serif" font-weight="500" font-size="28" fill="#01a1e3" letter-spacing="2">LL.M., M.A.</text>
        </svg>
      </div>
    </div>

  </div>
</body>
</html>
